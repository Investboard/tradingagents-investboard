[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-investboard"
version = "0.3.0"
description = "Connect a locally run TradingAgents analysis to your Investboard account"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["tradingagents", "investboard", "portfolio", "investment policy", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # TradingAgents itself is NOT declared, on purpose: it is not on PyPI (the
    # PyPI name `tradingagents` is an unrelated project), and PyPI refuses a
    # direct Git reference. `_framework.py` checks for it when `analyze` starts.
    # Upper bounds because both are load-bearing wire dependencies: httpx 1.0
    # and mcp 3.0 may move the transport and auth surfaces this package builds on.
    "httpx>=0.27,<1",
    # 2.x for `streamable_http_client` and `create_mcp_http_client`. mcp 1.x
    # names the transport `streamablehttp_client` and predates the httpx2 auth,
    # so auth.py does not import against it.
    "mcp>=2.0,<3",
    # Framework dependencies the vendor uses directly: the OHLCV frame and the
    # locally computed indicators. Declared here rather than inherited.
    "pandas>=2,<4",
    "stockstats>=0.6,<1",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://investboard.de"
Repository = "https://github.com/Investboard/tradingagents-investboard"
Issues = "https://github.com/Investboard/tradingagents-investboard/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
tradingagents-investboard = "tradingagents_investboard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults; that is the framework's API,
# not the mutable-default bug B008 looks for.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
