[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents-investboard"
version = "0.1.0"
description = "Connect a locally run TradingAgents analysis to your Investboard account"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@v0.4.0",
    "httpx>=0.27",
    # 2.x for `streamable_http_client` and `create_mcp_http_client`. mcp 1.x
    # names the transport `streamablehttp_client` and predates the httpx2 auth,
    # so auth.py does not import against it.
    "mcp>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
tradingagents-investboard = "tradingagents_investboard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
